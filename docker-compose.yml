services:
  mysql:
    image: mysql:8.0
    container_name: ptc_smart_schedulev4_mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ptc1234
      MYSQL_DATABASE: ptc_smart_schedulev4
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pptc1234"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  mysql_data:
